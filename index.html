<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>The Odin Project - Calculator</title>
</head>
<body>
    <div id="container">
        <div>
            <input type="text" class="input" inputmode="decimal" autofocus dir="rtl">
        </div>

        <div id="col-container">
            <div class="cols">
                <div class="buttons operator" role="button" tabindex="0">x&sup2;</div>
                <div class="buttons numbers" role="button" tabindex="0">7</div>
                <div class="buttons numbers" role="button" tabindex="0">4</div>
                <div class="buttons numbers" role="button" tabindex="0">1</div>
                <div class="buttons numbers dot" role="button" tabindex="0">.</div>
            </div>
            <div class="cols">
                <div class="buttons operator" role="button" tabindex="0">&radic;</div>
                <div class="buttons numbers" role="button" tabindex="0">8</div>
                <div class="buttons numbers" role="button" tabindex="0">5</div>
                <div class="buttons numbers" role="button" tabindex="0">2</div>
                <div class="buttons numbers" role="button" tabindex="0">0</div>
            </div>
            <div class="cols">
                <div class="buttons clear" role="button" tabindex="0">clr</div>
                <div class="buttons numbers" role="button" tabindex="0">9</div>
                <div class="buttons numbers" role="button" tabindex="0">6</div>
                <div class="buttons numbers" role="button" tabindex="0">3</div>
                <div class="buttons equals" role="button" tabindex="0">&equals;</div>
            </div>
            <div class="cols">
                <div class="buttons delete" role="button" tabindex="0">del</div>
                <div class="buttons operator" role="button" tabindex="0">&divide;</div>
                <div class="buttons operator" role="button" tabindex="0">&times;</div>
                <div class="buttons operator" role="button" tabindex="0">&minus;</div>
                <div class="buttons operator" role="button" tabindex="0">&plus;</div>
            </div>
        </div>
    </div>
</body>
</html>
