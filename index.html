<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
    <title>The Odin Project - Calculator</title>
</head>
<body>
    <div id="container">
        <div class="input">
            <input type="text" autofocus class="input">
        </div>

        <div id="col-container">
            <div class="cols">
                <div class="buttons" role="button" tabindex="0">x^2</div>
                <div class="buttons" role="button" tabindex="0">7</div>
                <div class="buttons" role="button" tabindex="0">4</div>
                <div class="buttons" role="button" tabindex="0">1</div>
                <div class="buttons" role="button" tabindex="0">.</div>
            </div>
            <div class="cols">
                <div class="buttons" role="button" tabindex="0">sqrt</div>
                <div class="buttons" role="button" tabindex="0">8</div>
                <div class="buttons" role="button" tabindex="0">5</div>
                <div class="buttons" role="button" tabindex="0">2</div>
                <div class="buttons" role="button" tabindex="0">0</div>
            </div>
            <div class="cols">
                <div class="buttons" role="button" tabindex="0">clr</div>
                <div class="buttons" role="button" tabindex="0">9</div>
                <div class="buttons" role="button" tabindex="0">6</div>
                <div class="buttons" role="button" tabindex="0">3</div>
                <div class="buttons" role="button" tabindex="0">=</div>
            </div>
            <div class="cols">
                <div class="buttons" role="button" tabindex="0">del</div>
                <div class="buttons" role="button" tabindex="0">/</div>
                <div class="buttons" role="button" tabindex="0">x</div>
                <div class="buttons" role="button" tabindex="0">-</div>
                <div class="buttons" role="button" tabindex="0">+</div>
            </div>
        </div>
    </div>
</body>
</html>
